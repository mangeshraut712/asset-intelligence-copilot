<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><title>Asset Intelligence Copilot</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--r:10px}
[data-theme=dark]{--bg:#0b0f14;--panel:#121820;--panel2:#0e1319;--line:#232c37;--fg:#e7ebef;--mut:#8994a0;--acc:#f5a524;--acc2:#3fa9f5;--ok:#22c55e;--bad:#ef4444;--warn:#eab308}
[data-theme=light]{--bg:#f5f6f8;--panel:#ffffff;--panel2:#f0f2f5;--line:#dde2e8;--fg:#18202a;--mut:#5d6873;--acc:#d97706;--acc2:#0b78c2;--ok:#15803d;--bad:#dc2626;--warn:#a16207}
*{box-sizing:border-box}body{margin:0;font:14px/1.55 Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--fg);display:grid;grid-template-columns:260px 1fr 340px;height:100vh;overflow:hidden}
aside,#brief{background:var(--panel);overflow:auto;padding:16px}aside{border-right:1px solid var(--line)}#brief{border-left:1px solid var(--line)}
main{display:flex;flex-direction:column;min-width:0}header{display:flex;align-items:center;gap:10px;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
.logo{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--acc),#f97316);display:grid;place-items:center;font-weight:800;color:#111}
h1{font-size:15px;margin:0}h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:18px 0 8px}
.mut{color:var(--mut);font-size:12px}.sp{flex:1}
select,textarea{width:100%;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);padding:7px 12px}button.pri{background:var(--acc);border-color:var(--acc);color:#111;font-weight:600}
#log{flex:1;overflow:auto;padding:24px}.msg{max-width:960px;margin:0 auto 16px}.uq{display:flex;justify-content:flex-end}.uq div{background:var(--acc2);color:#fff;padding:9px 14px;border-radius:14px 14px 2px 14px;max-width:75%}
.who{font-size:11px;color:var(--mut);text-align:right;margin-bottom:3px}
.bot{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}.bot p{margin:.4em 0}
.badge{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:1px 9px;margin-right:6px;border:1px solid}
.b-high{color:var(--ok);border-color:var(--ok)}.b-medium{color:var(--acc2);border-color:var(--acc2)}.b-low{color:var(--warn);border-color:var(--warn)}.b-conflict{color:var(--bad);border-color:var(--bad)}
.cites{margin-top:10px;font-size:12px;color:var(--mut)}.cite{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:0 6px;margin:2px;cursor:pointer;color:var(--fg)}.cite:hover{border-color:var(--acc)}
table{border-collapse:collapse;width:100%;margin-top:10px;font-size:13px}td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{color:var(--mut);font-weight:600;font-size:12px}
.card{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.card div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px}.card b{display:block;font-size:18px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.map{height:360px;margin-top:10px;border-radius:8px}
details.trace{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;font-size:12px}details.trace summary{cursor:pointer;color:var(--acc2)}details.trace li{margin:3px 0}code{background:var(--panel2);padding:0 4px;border-radius:4px;font-size:12px}
.chips{margin-top:10px}.chip{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;margin:3px 4px 0 0;cursor:pointer;color:var(--mut)}.chip:hover{color:var(--fg);border-color:var(--acc)}
.steps{font-size:12px;color:var(--mut)}.steps div:before{content:"◌ ";color:var(--acc)}.steps div.done:before{content:"✓ ";color:var(--ok)}
form{display:flex;gap:8px;padding:12px 24px;border-top:1px solid var(--line);background:var(--panel)}form textarea{height:46px;resize:none}
.ex{display:block;font-size:12px;color:var(--mut);cursor:pointer;margin:5px 0;line-height:1.35}.ex:hover{color:var(--fg)}
.bc{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--mut);border-radius:8px;padding:10px;margin-bottom:10px}.bc.high{border-left-color:var(--bad)}.bc.med{border-left-color:var(--warn)}.bc.low{border-left-color:var(--acc2)}
.bc summary{cursor:pointer;display:flex;justify-content:space-between;font-weight:600;font-size:13px}.bc .n{font-size:18px}.bc li{font-size:12px;margin:4px 0;color:var(--mut)}
#drawer{position:fixed;top:0;right:0;width:520px;max-width:95vw;height:100vh;background:var(--panel);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.3);transform:translateX(100%);transition:.2s;z-index:1000;display:flex;flex-direction:column}
#drawer.open{transform:none}#drawer .hd{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}#drawer .bd{overflow:auto;padding:16px;font-size:13px}
#drawer pre{white-space:pre-wrap;font-size:12px;background:var(--panel2);padding:10px;border-radius:8px}mark{background:rgba(245,165,36,.35);color:inherit;padding:0 2px}
.gem{margin-top:10px;border:1px solid var(--line);border-left:3px solid #8b5cf6;border-radius:8px;padding:8px 10px;font-size:13px;background:var(--panel2)}.gem b{color:#8b5cf6}
.memo{font-size:11px;color:var(--mut);white-space:pre-wrap}
</style></head><body>
<aside>
 <div class="mut">Acting as</div><select id="user"></select>
 <div style="margin-top:10px;display:flex;gap:6px"><button onclick="newChat()">＋ New chat</button></div>
 <h3>Try</h3><div id="exs"></div>
 <h3>Gemma 4 vision</h3><a class="ex" onclick="sampleVision()">📷 Describe sample inspection photo (WELL-0151)</a>
 <h3>Memory</h3><div class="memo" id="mem"></div>
</aside>
<main>
 <header><div class="logo">AI</div><div><h1>Asset Intelligence Copilot</h1><div class="mut" id="st">loading…</div></div><div class="sp"></div>
  <button onclick="toggleTheme()" title="Theme">◐ Theme</button></header>
 <div id="log"></div>
 <form onsubmit="send(event)"><input type="file" id="img" accept="image/*" style="display:none" onchange="vision(this.files[0])"><button type="button" title="Gemma 4 vision: describe an inspection photo" onclick="$('img').click()">📷</button><textarea id="q" placeholder="Ask about wells, spills, downtime, compliance… or correct the data (Enter to send)"></textarea><button class="pri">Ask</button></form>
</main>
<section id="brief"><h3 style="margin-top:0">Field briefing <span class="mut" id="asof"></span></h3><div id="cards" class="mut">loading…</div></section>
<div id="drawer"><div class="hd"><b id="dt">Evidence</b><div class="sp"></div><button onclick="$('drawer').classList.remove('open')">✕</button></div><div class="bd" id="db"></div></div>
<script>
const EX=["Is WELL-0001 producing oil right now? When was it last inspected, and by whom?","Which wells in Northeast Block 8 are not producing oil right now, and why? Show them in a table.","Show a line chart of WELL-0001's wellhead temperature against air temperature for the last 13 weeks, and mark when it was not producing oil.","Which 3 wells in Northeast Block 7 had the most downtime in the last 4 months? Show a bar chart.","Show on a map every well in Northeast Block 8 with a real spill in the last 90 days.","Show a heatmap of 2026 spills by geographic area and month.","Which rules has WELL-0001 broken in the last 12 months, and what is still open?","Was the 20 Aug spill at WELL-0101 real oil?","Show downtime by area this summer as a bar chart."];
let chat='c'+Date.now();const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function toggleTheme(){const h=document.documentElement;h.dataset.theme=h.dataset.theme=='dark'?'light':'dark';localStorage.theme=h.dataset.theme}
if(localStorage.theme)document.documentElement.dataset.theme=localStorage.theme;
function newChat(){chat='c'+Date.now();$('log').innerHTML='<div class="msg mut" style="text-align:center">New conversation as <b>'+esc($('user').selectedOptions[0]?.textContent||'')+'</b>. Private history is per user; well facts and corrections are shared.</div>'}
EX.forEach(e=>{const a=document.createElement('a');a.className='ex';a.textContent=e;a.onclick=()=>ask(e);$('exs').appendChild(a)});
fetch('/api/users').then(r=>r.json()).then(us=>{us.forEach(u=>{const o=document.createElement('option');o.value=u.user_id;o.textContent=`${u.name} — ${u.role.replace(/_/g,' ')}`;if(u.user_id=='U-201')o.selected=1;$('user').appendChild(o)});$('user').onchange=()=>{newChat();mem()};newChat()});
fetch('/api/status').then(r=>r.json()).then(s=>$('st').textContent=`${s.wells} wells · ${s.llm?'rules + LLM planner ('+s.model+')':'deterministic rule router'}`);
function mem(){fetch('/api/memory?user='+$('user').value).then(r=>r.json()).then(m=>{$('mem').textContent=[...m.shared_facts.map(f=>`● fact ${f.asset_id}: ${f.text} [${f.status}]`),...m.corrections.map(c=>`● correction ${c.inspection_id} ${c.field}: ${c.original_value} → ${c.corrected_value}`),...m.type_rules.map(t=>`● rule all ${t.well_type}: ${t.rule_key} = ${t.value}`),...m.conversations.slice(0,5).map(c=>`○ you asked: ${c.question.slice(0,60)}`)].join('\n')||'(empty)'})}
mem();
function briefing(){fetch('/api/briefing').then(r=>r.json()).then(b=>{$('asof').textContent='as of '+b.as_of;$('cards').innerHTML=b.cards.map(c=>`<details class="bc ${c.severity}"><summary><span>${esc(c.title)}</span><span class="n">${c.count}${c.total?' · USD '+c.total.toLocaleString():''}</span></summary><ul style="padding-left:16px">${c.items.slice(0,30).map(i=>`<li>${esc(i.text)} ${i.cite.map(x=>`<span class="cite" onclick="ev('${x}')">${x}</span>`).join('')}</li>`).join('')}</ul></details>`).join('')})}
briefing();
async function ev(ref){$('drawer').classList.add('open');$('dt').textContent=ref;$('db').innerHTML='loading…';const e=await (await fetch('/api/evidence?ref='+encodeURIComponent(ref))).json();
 let h='';if(e.kind)h+=`<div class="mut">${esc(e.kind)}${e.document?' · '+esc(e.document):''}</div>`;
 if(e.record)h+=`<table>${Object.entries(e.record).filter(([k,v])=>v!==null&&v!=='').map(([k,v])=>`<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join('')}</table>`;
 if(e.corrections&&e.corrections.length)h+=`<h3>Corrections & notes on this record</h3><pre>${esc(JSON.stringify(e.corrections,null,1))}</pre>`;
 if(e.text){let t=esc(e.text);(e.highlight||[]).forEach(l=>{const x=esc(l);if(x.trim())t=t.split(x).join('<mark>'+x+'</mark>')});h+=`<h3>${e.document?'Source document':'Text'}</h3><pre id="doc">${t}</pre>`}
 $('db').innerHTML=h;const m=$('db').querySelector('mark');if(m)m.scrollIntoView({block:'center'})}
$('q').addEventListener('keydown',e=>{if(e.key=='Enter'&&!e.shiftKey){e.preventDefault();send(e)}});
function send(e){e.preventDefault();const q=$('q').value.trim();if(q){$('q').value='';ask(q)}}
async function ask(q){
 const name=$('user').selectedOptions[0].textContent.split(' — ')[0];
 $('log').insertAdjacentHTML('beforeend',`<div class="msg"><div class="who">${esc(name)}</div><div class="uq"><div>${esc(q)}</div></div></div>`);
 const b=document.createElement('div');b.className='msg bot';const steps=['Parsing entities, metric and time window','Selecting deterministic tool','Querying records & applying corrections','Checking rules from manuals/SOPs','Composing answer & visual'];
 b.innerHTML='<div class="steps">'+steps.map(s=>`<div>${s}</div>`).join('')+'</div>';$('log').appendChild(b);$('log').scrollTop=1e9;
 let i=0;const tick=setInterval(()=>{const d=b.querySelectorAll('.steps div');if(d[i])d[i].className='done';i++},350);
 let r;try{r=await (await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,user:$('user').value,chat})})).json()}catch(err){clearInterval(tick);b.textContent='Error: '+err;return}
 clearInterval(tick);
 const conf={high:'High confidence',medium:'LLM-planned',low:'Low confidence',conflict:'Data conflict'}[r.confidence]||'';
 b.innerHTML=`<div><span class="badge b-${r.confidence}">${conf}</span><span class="mut">${esc(r.engine)}</span></div>`+marked.parse(r.text);
 if(r.visual)render(b,r.visual);
 const cites=[...new Set(r.citations)];b.insertAdjacentHTML('beforeend',`<div class="cites">Sources (${cites.length}): ${cites.slice(0,40).map(c=>`<span class="cite" onclick="ev(this.textContent)">${esc(c)}</span>`).join('')}${cites.length>40?' …':''}</div>`);
 const t=r.trace||{};b.insertAdjacentHTML('beforeend',`<details class="trace"><summary>How I got this</summary><ol>${(t.steps||[]).map(s=>`<li>Tool <code>${esc(s.tool)}</code> ${s.args?'<code>'+esc(JSON.stringify(s.args))+'</code>':''} ${s.result?'→ '+esc(s.result):''}</li>`).join('')}</ol>${(t.rules||[]).length?'<div><b>Rules applied (parsed from documents):</b><ul>'+t.rules.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul></div>':''}<div class="mut">Router: ${esc(t.engine)} · ${t.citations} distinct records/documents cited · numbers computed by deterministic tools, never by the LLM.</div></details>`);
 if(r.followups&&r.followups.length)b.insertAdjacentHTML('beforeend',`<div class="chips">${r.followups.map(f=>`<span class="chip">${esc(f)}</span>`).join('')}</div>`);
 b.querySelectorAll('.chip').forEach(c=>c.onclick=()=>ask(c.textContent));
 $('log').scrollTop=1e9;mem();if(/correct|rule|fact|recorded/i.test(r.text))briefing();
 if(LLM){const g=document.createElement('div');g.className='gem';g.innerHTML='<b>✨ Gemma 4</b> <span class="mut">writing a plain-language summary…</span>';b.querySelector('.cites').before(g);
  fetch('/api/phrase',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,text:r.text})}).then(x=>x.json()).then(p=>{
   if(p.ok&&p.summary)g.innerHTML=`<b>✨ Gemma 4 summary</b> <span class="mut">(${esc(p.model)}; numbers verified against the tool output)</span><div>${esc(p.summary)}</div>`;
   else if(p.rejected_numbers&&p.rejected_numbers.length)g.innerHTML=`<b>✨ Gemma 4</b> <span class="mut">summary rejected: it introduced numbers not in the tool output (${esc(p.rejected_numbers.join(', '))})</span>`;else g.remove()}).catch(()=>g.remove())}}
let LLM=false;fetch('/api/status').then(r=>r.json()).then(s=>LLM=s.llm);
async function sampleVision(){const bl=await (await fetch('/samples/inspection-WELL-0151.jpg')).blob();vision(new File([bl],'inspection-WELL-0151.jpg',{type:'image/jpeg'}),'WELL-0151')}
async function vision(f,well){if(!f)return;well=well||(($('q').value.match(/WELL-\d{4}/i)||[''])[0]);const url=URL.createObjectURL(f);
 $('log').insertAdjacentHTML('beforeend',`<div class="msg"><div class="who">${esc($('user').selectedOptions[0].textContent.split(' — ')[0])}</div><div class="uq"><div>📷 ${esc(f.name)}${well?' · '+esc(well):''}<br><img src="${url}" style="max-width:260px;border-radius:8px;margin-top:6px"></div></div></div>`);
 const b=document.createElement('div');b.className='msg bot';b.innerHTML='<div class="steps"><div>Sending photo to Gemma 4 (multimodal)…</div></div>';$('log').appendChild(b);$('log').scrollTop=1e9;
 const fd=new FormData();fd.append('file',f);fd.append('well',well||'');fd.append('user',$('user').value);
 const r=await (await fetch('/api/vision',{method:'POST',body:fd})).json();
 b.innerHTML=r.ok?`<div><span class="badge b-medium">Gemma 4 vision · advisory</span><span class="mut">${esc(r.model)}</span></div>${marked.parse(r.description||'')}${r.context?`<div class="mut">Records: ${esc(r.context)}</div>`:''}<div class="mut">Photo analysis is advisory: it never overrides inspection records. Use a correction ("The spill was X bbl…") to change data.</div>`:`<span class="badge b-low">Vision unavailable</span> ${esc(r.reason||'')}`;$('log').scrollTop=1e9}
const C=()=>getComputedStyle(document.documentElement);
function render(el,v){const d=document.createElement('div');el.appendChild(d);const fg=C().getPropertyValue('--mut'),acc=C().getPropertyValue('--acc'),acc2=C().getPropertyValue('--acc2');
 if(v.type=='table'){d.style.overflowX='auto';d.innerHTML=`<table><tr>${v.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${v.rows.slice(0,200).map(r=>`<tr>${v.columns.map(c=>{const s=String(r[c]??'');return `<td>${esc(s).replace(/((?:INS|MNT|REG|CTX)-\d{4}-\d{3,4})/g,'<span class="cite" onclick="ev(\'$1\')">$1</span>')}</td>`}).join('')}</tr>`).join('')}</table>`}
 else if(v.type=='card'){const s=v.data;d.innerHTML=`<div class="card"><div>Status<b class="${s.producing?'ok':'bad'}">${s.producing?'Producing':'Not producing'}</b><span class="mut">${esc(s.asset_id)} · ${esc(s.area)}</span></div><div>Wellhead − air<b>${s.delta_c} °C</b><span class="mut">limit ${s.threshold_c} °C (${s.well_type} manual)</span></div><div>Last inspection<b>${s.inspected_at.slice(0,10)}</b><span class="mut">${esc(s.inspector)} · ${s.method}</span></div><div>Recorded status<b class="${s.recorded_status_stale?'bad':''}">${s.recorded_status}</b><span class="mut">${s.recorded_status_stale?'out of date':'matches data'}</span></div></div>`}
 else if(v.type=='line'||v.type=='bar'){const cv=document.createElement('canvas');cv.style.maxHeight='340px';d.appendChild(cv);const cols=[acc,acc2,'#a78bfa','#34d399'];const ds=v.series.map((s,i)=>({label:s.name,data:s.data,borderColor:cols[i%4],backgroundColor:cols[i%4],tension:.25,borderRadius:4}));
  if(v.marks)ds.push({label:v.mark_label,type:'scatter',data:v.x.map((x,i)=>v.marks.includes(x)?{x,y:v.series[0].data[i]}:null).filter(Boolean),backgroundColor:'#ef4444',pointRadius:7});
  new Chart(cv,{type:v.type,data:{labels:v.x,datasets:ds},options:{plugins:{legend:{labels:{color:fg}}},scales:{x:{ticks:{color:fg},grid:{color:'rgba(128,128,128,.12)'}},y:{ticks:{color:fg},grid:{color:'rgba(128,128,128,.12)'}}}}})}
 else if(v.type=='map'){d.className='map';setTimeout(()=>{const mp=L.map(d);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(mp);const ps=v.points.map(p=>L.marker([p.lat,p.lon]).addTo(mp).bindTooltip(p.label,{permanent:v.points.length<=6,direction:'right'}));if(ps.length)mp.fitBounds(L.featureGroup(ps).getBounds().pad(0.3));else mp.setView([32,-102.3],10)},0)}
 else if(v.type=='heatmap'){const mx=Math.max(1,...v.z.flat());d.style.overflowX='auto';d.innerHTML=`<table><tr><th></th>${v.x.map(x=>`<th style="text-align:center">${x}</th>`).join('')}<th>Total</th></tr>${v.y.map((y,i)=>`<tr><th>${esc(y)}</th>${v.z[i].map(z=>`<td style="background:rgba(239,68,68,${(z/mx*.85).toFixed(2)});text-align:center;font-weight:600">${z}</td>`).join('')}<td><b>${v.z[i].reduce((a,b)=>a+b,0)}</b></td></tr>`).join('')}</table>`}}
</script></body></html>
